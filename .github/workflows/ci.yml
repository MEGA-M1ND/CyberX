name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  V1_DIR: experiments/remediation-verification-v1
  V2_DIR: experiments/remediation-verification-v2

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Confirm no third-party runtime dependencies
        run: |
          cd "$V1_DIR" && python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          import rvbench.runner, rvbench.analysis.report  # must import with stdlib only
          print("v1 stdlib-only import OK")
          EOF
          cd "$GITHUB_WORKSPACE/$V2_DIR" && python - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          import rv2.bench.run, rv2.analysis.reports  # must import with stdlib only
          print("v2 stdlib-only import OK")
          EOF
      - name: Run v1 test suite (regression guard)
        run: |
          cd "$V1_DIR"
          pytest -q
      - name: Run v2 test suite
        run: |
          cd "$V2_DIR"
          pytest -q

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip ruff
      - name: ruff check
        run: |
          ruff check "$V1_DIR"
          ruff check "$V2_DIR"
      - name: byte-compile everything
        run: |
          python -m compileall -q "$V1_DIR"
          python -m compileall -q "$V2_DIR"

  experiment:
    name: experiment reproducibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: v1 reproducibility gate (frozen artifact must not drift)
        run: |
          cd "$V1_DIR"
          python check_reproducibility.py
      - name: v1 end to end
        run: |
          cd "$V1_DIR"
          python run_experiment.py
      - name: v2 end to end
        run: |
          cd "$V2_DIR"
          python run_experiment.py
      - name: v2 reproducibility gate (holdout manifest + two prediction passes)
        run: |
          cd "$V2_DIR"
          python check_reproducibility.py
      - name: Upload result artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            ${{ env.V1_DIR }}/results/
            ${{ env.V1_DIR }}/reports/
            ${{ env.V1_DIR }}/cases/MANIFEST.json
            ${{ env.V2_DIR }}/artifacts/
            ${{ env.V2_DIR }}/reports/
            ${{ env.V2_DIR }}/manifests/
          retention-days: 30

  safety:
    name: safety boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - name: v1 - assert the benchmark cannot touch the host or the network
        run: |
          cd "$V1_DIR"
          pytest -q tests/test_safety_and_llm.py tests/test_leakage.py
      - name: v2 - assert the benchmark cannot touch the host or the network
        run: |
          cd "$V2_DIR"
          pytest -q tests/test_safety.py tests/test_layering.py
      - name: Assert real-endpoint adapters stay disabled by default
        run: |
          test -z "${ALLOW_REAL_WINDOWS_LAB:-}" || (echo "ALLOW_REAL_WINDOWS_LAB must not be set in CI" && exit 1)
          test -z "${RVBENCH_LLM_ENABLED:-}" || (echo "RVBENCH_LLM_ENABLED must not be set in CI" && exit 1)
          echo "real-endpoint and LLM paths are disabled"
