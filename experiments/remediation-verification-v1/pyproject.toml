# Tool configuration only. The benchmark has no third-party runtime dependencies
# and is not packaged for distribution.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["results", "cases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",   # long lines are checked by line-length, not flagged twice
    "E731",   # short lambdas are used deliberately in test helpers
    "B905",   # zip(strict=) is 3.10+, kept off for readability
]
# typing.Dict/List style is used consistently for 3.9 readability; UP rules are off.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]           # sys.path setup must precede imports
"run_experiment.py" = ["E402"]
"check_reproducibility.py" = ["E402"]
"conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
